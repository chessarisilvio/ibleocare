<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Riservata - IbleoCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">🌿 IbleoCare</h2>
                            <p class="text-muted">Accesso Area Riservata</p>
                        </div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" id="username" class="form-control" placeholder="Inserisci username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Accedi alla Dashboard</button>
                            <div id="errorMsg" class="alert alert-danger mt-3 d-none text-center" role="alert">
                                Credenziali errate!
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none text-muted">← Torna alla Home</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                
                if (res.ok) {
                    // SALVATAGGIO STATO LOGIN: Fondamentale per il frontend
                    localStorage.setItem('ibleocare_login', 'true');
                    localStorage.setItem('ibleocare_user', u);
                    
                    // Successo: entra nella dashboard protetta
                    window.location.href = '/private/dashboard.html';
                } else {
                    // Errore credenziali
                    document.getElementById('errorMsg').classList.remove('d-none');
                }
            } catch (error) {
                console.error("Errore di connessione al server:", error);
                document.getElementById('errorMsg').textContent = "Errore di connessione al server.";
                document.getElementById('errorMsg').classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
